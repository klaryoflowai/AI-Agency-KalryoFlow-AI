name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/dashboard/package-lock.json

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install dashboard dependencies
        working-directory: infrastructure/dashboard
        run: npm ci

      - name: Compile Python
        run: python -m py_compile execution/agency.py execution/validate_supabase_migrations.py execution/validate_n8n_workflows.py execution/hooks/*.py

      - name: Validate Supabase migrations
        run: python execution/validate_supabase_migrations.py

      - name: Validate n8n workflows
        run: python execution/validate_n8n_workflows.py

      - name: Scan forbidden runtime drift
        run: python execution/hooks/scan_forbidden_runtime.py

      - name: Run tests
        run: python -m pytest

      - name: Lint dashboard
        working-directory: infrastructure/dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: infrastructure/dashboard
        run: npm run build
