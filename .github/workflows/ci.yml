name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m py_compile execution/agency.py execution/validate_supabase_migrations.py execution/hooks/*.py

      - name: Validate Supabase migrations
        run: python execution/validate_supabase_migrations.py

      - name: Scan forbidden runtime drift
        run: python execution/hooks/scan_forbidden_runtime.py

      - name: Run tests
        run: python -m pytest
